  <rect x="250" y="30" width="220" height="56" rx="8"/>
  <text x="360" y="54" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">the page's focus party</text>
  <text x="360" y="74" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.7">its root: the home has what reaches it</text>
  <rect x="250" y="172" width="220" height="56" rx="8"/>
  <text x="360" y="196" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">the viewer</text>
  <text x="360" y="216" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.7">a member, passed by: nothing designed</text>
  <rect x="250" y="314" width="220" height="56" rx="8"/>
  <text x="360" y="338" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600">the viewport</text>
  <text x="360" y="358" text-anchor="middle" fill="currentColor" stroke="none" opacity="0.7">the native world: + − 0 and the arrows</text>
  <path d="M300 172V86M294 95L300 86L306 95"/>
  <text x="288" y="134" text-anchor="end" fill="currentColor" stroke="none">passed by: on up, to the first that holds</text>
  <path d="M300 314V228M294 237L300 228L306 237"/>
  <text x="288" y="276" text-anchor="end" fill="currentColor" stroke="none">an Escape it has no use for: a yield</text>
